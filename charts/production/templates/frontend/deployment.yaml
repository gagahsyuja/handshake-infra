apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "handshake.frontend" . }}
  labels: {{ include "handshake.frontend.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{ include "handshake.frontend.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "handshake.frontend.labels" . | nindent 8 }}
      annotations: {{ include "handshake.frontend.vault.annotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Namespace | quote }}
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          ports:
            - containerPort: {{ template "handshake.frontend.port" . }}
          command: [ "bash", "-c" ]
          args:
            - |
              source /vault/secrets/frontend
              exec node /app/dist/server/entry.mjs
          livenessProbe:
            httpGet:
              path: /live
              port: {{ template "handshake.frontend.port" . }}
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ template "handshake.frontend.port" . }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ include "handshake.frontend.resources" . | nindent 12 }}
        - name: ts-sidecar
          image: ghcr.io/tailscale/tailscale:latest
          securityContext:
            privileged: true
          env:
            - name: TS_HOSTNAME
              value: {{ include "handshake.frontend" . | quote }}
            - name: TS_KUBE_SECRET
              value: {{ printf "%s-tailscale" (include "handshake.frontend" . ) }}
            - name: TS_USERSPACE
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TS_ACCEPT_DNS
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth-key
                  key: AUTH_KEY
