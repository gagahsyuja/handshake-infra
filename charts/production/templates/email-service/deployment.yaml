apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "handshake.email" . }}
  labels: {{ include "handshake.email.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.emailService.replicas }}
  selector:
    matchLabels: {{ include "handshake.email.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "handshake.email.labels" . | nindent 8 }}
      annotations: {{ include "handshake.email.vault.annotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Namespace | quote }}
      containers:
        - name: email-service
          image: {{ .Values.emailService.image.repository }}:{{ .Values.emailService.image.tag }}
          ports:
            - containerPort: {{ template "handshake.email.port" . }}
          command: [ "bash", "-c" ]
          args:
            - |
              source /vault/secrets/email
              exec handshake_email
          livenessProbe:
            httpGet:
              path: /live
              port: {{ template "handshake.email.port" . }}
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ template "handshake.email.port" . }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ include "handshake.email.resources" . | nindent 12 }}
