apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "handshake.auth.db" . }}
  labels: {{ include "handshake.auth.db.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  serviceName: {{ template "handshake.auth.db" . }}
  replicas: {{ .Values.authService.database.replicas }}
  selector:
    matchLabels: {{ include "handshake.auth.db.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "handshake.auth.db.labels" . | nindent 8 }}
      annotations: {{ include "handshake.auth.db.vault.annotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Namespace | quote }}
      topologySpreadConstraints: {{ include "handshake.db.topologySpreadConstraints" . | nindent 8 }}
      securityContext: {{ include "handshake.securityContext.pod" . | nindent 8 }}
      containers:
        - name: auth-service-db
          image: {{ .Values.authService.database.image.repository }}:{{ .Values.authService.database.image.tag }}
          ports:
            - containerPort: {{ include "handshake.auth.db.port" . }}
          command: [ "bash", "-c" ]
          args:
            - |
              while [ ! -f /vault/secrets/auth-db ]; do
                echo "Waiting for Vault secrets..."
                sleep 2
              done
              source /vault/secrets/auth-db
              exec /usr/local/bin/docker-entrypoint.sh postgres
          securityContext: {{ include "handshake.securityContext.container" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ include "handshake.auth.db.port" . }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: {{ include "handshake.auth.db.storage.accessModes" . }}
        storageClassName: {{ include "handshake.auth.db.storage.className" . }}
        resources:
          requests:
            storage: 1Gi
